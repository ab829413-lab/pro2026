<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etsy Profit Radar</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f8;--card:#fff;--ink:#16213a;--mut:#5d6b82;--line:#dbe2ec;--ac:#5b3df5;--on:#fff;--ok:#12805a;--wn:#a55f00;--bd:#c42b2b;--okb:#dff5ea;--wnb:#fdf0d5;--bdb:#fde3e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mut:#9aa8c2;--line:#2a3652;--ac:#9a86ff;--on:#10172a;--ok:#4cd39b;--wn:#f0b04a;--bd:#ff7b7b;--okb:#12382d;--wnb:#3b2d10;--bdb:#442022}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mut:#9aa8c2;--line:#2a3652;--ac:#9a86ff;--on:#10172a;--ok:#4cd39b;--wn:#f0b04a;--bd:#ff7b7b;--okb:#12382d;--wnb:#3b2d10;--bdb:#442022}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 'IBM Plex Sans Arabic',system-ui,-apple-system,Segoe UI,Roboto,Tahoma,sans-serif}
main{max-width:1020px;margin:auto;padding:16px}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
.g{display:grid;gap:14px}.col{display:grid;gap:14px;align-content:start}
@media(min-width:820px){.g{grid-template-columns:5fr 6fr;align-items:start}}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.w{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut)}
input,select{width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input[type=number],#cur{direction:ltr;text-align:left}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
summary{cursor:pointer;font-weight:600;margin-bottom:8px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.r.t{font-weight:700;border-bottom:2px solid var(--ink)}
.r.s{color:var(--mut);font-size:13px;border:0;padding:10px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:38px;font-weight:700;line-height:1.15}
.pill{padding:2px 12px;border-radius:99px;font-size:13px;font-weight:600}
.ok{background:var(--okb);color:var(--ok)}.wn{background:var(--wnb);color:var(--wn)}.bd{background:var(--bdb);color:var(--bd)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 4px;background:var(--line)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-bottom:8px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.k div{background:var(--bg);border-radius:10px;padding:10px}.k small{display:block;color:var(--mut);font-size:12px}.k b{font-size:18px}
.tip{margin:8px 0 0;padding:9px 12px;border-radius:10px;background:var(--wnb);color:var(--ink);font-size:14px}
table{width:100%;border-collapse:separate;border-spacing:3px;text-align:center;font-size:13px}
td{padding:8px 2px;border-radius:6px;font-weight:600}th{font-weight:600;color:var(--mut);font-size:12px}
button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--on);cursor:pointer}
button.sec{background:none;color:var(--ink);border:1px solid var(--line);padding:6px 12px}
button.sec[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.x{background:none;color:var(--bd);border:1px solid var(--line);padding:1px 8px;font-size:12px;margin-inline-start:6px}
.foot{color:var(--mut);font-size:12px;margin:14px 0 0}
.bn{background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.bn a.btn{display:inline-block;padding:9px 14px;border-radius:8px;background:var(--ac);color:var(--on);font-weight:600;text-decoration:none}
.bn details{width:100%}.bn .r2{display:flex;gap:8px;align-items:center}.bn .r2 input{margin:0}
.lk{opacity:.55;position:relative}.lk::after{content:"🔒";position:absolute;inset-inline-end:8px;top:6px}
.er{color:var(--bd);font-size:13px;margin:4px 0 0}
</style>
</head>

<div class="top"><h1 data-k="title"></h1><div><button class="sec" data-l="en">EN</button> <button class="sec" data-l="ar">العربية</button></div></div>

</div>

<section class="c">
<div class="top"><h2 id="tt" style="margin:0"></h2><span class="pill" id="pl"></span></div>
<div class="big" id="bg"></div>
<div class="sub" id="mg" style="margin:0"></div>
<div class="bar" id="br"></div><div class="lg" id="lg"></div>
<div id="rc"></div>
<p style="margin:12px 0 0"><button id="sv" data-k="save"></button></p>
</section>
<section class="c"><h2 data-k="kT"></h2><div class="k" id="kp"></div><div id="tp"></div></section>
<section class="c"><h2 data-k="hmT"></h2><p class="sub" style="margin-bottom:6px" data-k="hmD"></p><div id="hm"></div></section>
<section class="c"><div class="top"><h2 data-k="lsT"></h2><button class="sec" id="ex" data-k="csv"></button></div><div id="ls"></div></section>
</div>
</div>
<section class="c" id="sl" hidden></section>
<p class="foot" data-k="foot"></p>
</main>
